<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Formulário de inscrição para novidades do Blog Horizonte.">
    <title>Inscrição | Blog Horizonte</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="pagina">
      <header class="cabecalho">
        <p class="sobretitulo">Blog Horizonte</p>
        <h1>Inscreva-se para receber novidades</h1>
        <p>Conteúdos selecionados e novidades do blog diretamente no seu e-mail.</p>
      </header>

      <form class="formulario" action="#" method="post">
        <div class="campos">
          <div class="linha-dupla">
            <div class="campo">
              <label for="nome">Nome</label>
              <input id="nome" name="nome" type="text" autocomplete="name" placeholder="Seu nome" required>
            </div>

            <div class="campo">
              <label for="email">E-mail</label>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@email.com" required>
            </div>
          </div>

          <div class="campo">
            <label for="interesse">Tema de interesse</label>
            <select id="interesse" name="interesse" required>
              <option value="" selected disabled>Escolha uma opção</option>
              <option value="tecnologia">Tecnologia</option>
              <option value="design">Design</option>
              <option value="carreira">Carreira</option>
            </select>
          </div>
        </div>

        <button type="submit">Quero me inscrever</button>
        <p class="aviso">Você pode cancelar sua inscrição quando quiser.</p>
      </form>
    </main>
  </body>
</html>
